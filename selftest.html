<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点自检 · SELFTEST</title>
<style>
  body { font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 28px 20px 60px; background: #f6f5f3; color: #26221c; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { color: #8a8378; font-size: 12.5px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e6e2d9; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed #efebe3; }
  .row:last-child { border-bottom: 0; }
  .k { flex: 0 0 190px; color: #6c6558; font-size: 13px; }
  .v { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
  .ok { color: #1f7a45; } .bad { color: #b3382f; } .wait { color: #8a8378; }
  .verdict { font-weight: 600; }
  .tip { color: #6c6558; font-size: 12.5px; margin-top: 10px; }
  code { background: #f1eee7; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>站点自检</h1>
  <div class="sub">这个页面不依赖任何脚本，只要能打开，就说明静态托管是通的。</div>

  <div class="card">
    <div class="row"><span class="k">自检页地址</span><span class="v" id="v-url">-</span></div>
    <div class="row"><span class="k">部署版本戳</span><span class="v" id="v-ver">-</span></div>
    <div class="row"><span class="k">访问时间</span><span class="v" id="v-time">-</span></div>
  </div>

  <div class="card">
    <div class="row"><span class="k">首页 index.html</span><span class="v wait" id="r-index">检测中…</span></div>
    <div class="row"><span class="k">样式 css/style.css</span><span class="v wait" id="r-css">检测中…</span></div>
    <div class="row"><span class="k">配置 js/config.js</span><span class="v wait" id="r-config">检测中…</span></div>
    <div class="row"><span class="k">数据层 js/supabase.js</span><span class="v wait" id="r-sb">检测中…</span></div>
    <div class="row"><span class="k">前台 js/frontend.js</span><span class="v wait" id="r-fe">检测中…</span></div>
    <div class="row"><span class="k">后台 admin.html</span><span class="v wait" id="r-admin">检测中…</span></div>
  </div>

  <div class="card">
    <div class="row"><span class="k">判定</span><span class="v verdict" id="v-verdict">检测中…</span></div>
    <div class="tip" id="v-tip"></div>
  </div>

<script>
(function () {
  document.getElementById("v-url").textContent = location.href;
  document.getElementById("v-time").textContent = new Date().toLocaleString("zh-CN");

  /* 版本戳直接从自检页自身的资源引用里读不到，改为取同目录首页里的标记 */
  fetch("index.html", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) {
      var m = t.match(/\?v=(20\d{4,8}[A-Z]?)/);
      document.getElementById("v-ver").textContent = m ? m[1] : (t ? "未识别（首页可能不是当前版本）" : "-");
    })
    .catch(function () {});

  var files = [
    ["index.html", "r-index"],
    ["css/style.css", "r-css"],
    ["js/config.js", "r-config"],
    ["js/supabase.js", "r-sb"],
    ["js/frontend.js", "r-fe"],
    ["admin.html", "r-admin"]
  ];
  var bad = 0, okCount = 0;

  function mark(id, text, cls) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = "v " + cls;
  }

  var left = files.length;
  files.forEach(function (f) {
    fetch(f[0], { cache: "no-store", method: "GET" })
      .then(function (r) {
        if (r.ok) { okCount++; mark(f[1], "正常（" + r.status + "）", "ok"); }
        else { bad++; mark(f[1], "打不开（" + r.status + "）", "bad"); }
      })
      .catch(function () { bad++; mark(f[1], "请求失败（网络或路径问题）", "bad"); })
      .finally(function () {
        left--;
        if (left) return;
        var v = document.getElementById("v-verdict"), tip = document.getElementById("v-tip");
        if (bad === 0) {
          v.textContent = "静态文件都在，问题不在部署";
          v.className = "v verdict ok";
          tip.innerHTML = "所有关键文件都能取到。请回到首页：如果一直转圈超过 8 秒，说明浏览器拿到的还是旧页面（缓存）；" +
            "如果 8 秒后出现「脚本加载出错」，则是脚本层面的问题。";
        } else if (okCount === 0) {
          v.textContent = "文件全部取不到 —— 部署或文件位置有问题";
          v.className = "v verdict bad";
          tip.innerHTML = "请确认：① 部署平台最近一次部署是否成功；② 仓库根目录是否直接就是 <code>index.html</code>，" +
            "而不是多套了一层文件夹（例如 <code>站点名/index.html</code>）。";
        } else {
          v.textContent = "部分文件缺失（" + bad + " 个）";
          v.className = "v verdict bad";
          tip.innerHTML = "说明上传不完整。请重新完整解压覆盖，确保 <code>index.html</code>、<code>js/</code>、" +
            "<code>css/</code>、<code>vendor/</code> 在同一层目录下。";
        }
      });
  });
})();
</script>
</body>
</html>
