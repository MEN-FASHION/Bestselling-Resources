<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{--fv-ease:cubic-bezier(.22,.61,.36,1);--line:#e5e0d8;--sub:#8a8172;--shade:#f0eee9;--gold:#c8a45c;--danger:#c25e5a}
body{margin:0;background:#f7f5f1;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#2a2620;-webkit-font-smoothing:antialiased}
.wrap{display:flex;gap:34px;padding:34px 40px 40px}
.panel{width:376px;background:rgba(255,255,255,.72);border:1px solid rgba(28,24,18,.07);border-radius:20px;padding:16px 16px 20px;
 box-shadow:0 24px 48px -30px rgba(34,28,20,.35),0 2px 8px rgba(34,28,20,.05)}
h3{margin:2px 0 12px;font-size:13px;font-weight:600;letter-spacing:.02em}
h3 em{font-style:normal;color:#9a9182;font-weight:400;margin-left:6px;font-size:11.5px}
.fv-subbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 -2px 10px;padding:6px 2px 9px;border-bottom:1px solid rgba(28,24,18,.05)}
.fv-subbar-t{font-size:10px;letter-spacing:.08em;color:rgba(90,82,70,.55);margin-right:2px}
.fv-sub{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;cursor:pointer;
 border:1px solid rgba(28,24,18,.1);background:rgba(255,255,255,.6);color:var(--sub);font-size:11.5px;font-family:inherit}
.fv-sub i{font-style:normal;font-size:10px;color:rgba(90,82,70,.6)}
.fv-sub.is-on{border-color:#c8a45c;background:rgba(200,164,92,.14);color:#8b6b28;font-weight:600}
.fv-d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.fv-d-cell{position:relative;margin:0;overflow:hidden;border:1px solid rgba(28,24,18,.06);border-radius:12px;background:var(--shade);box-shadow:0 1px 2px rgba(30,25,18,.05)}
.fv-d-cell img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.fv-d-cell figcaption{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 7px 6px;margin:0;font-size:10px;line-height:1.45;color:#fff;
 background:linear-gradient(to top,rgba(18,15,12,.82),rgba(18,15,12,.42) 55%,rgba(18,15,12,0));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .26s var(--fv-ease),transform .3s var(--fv-ease)}
.fv-d-cell .fv-d-tag{position:absolute;left:5px;top:5px;z-index:3;max-width:calc(100% - 10px);padding:1.5px 6px;border-radius:6px;font-size:9.5px;color:#fff;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-4px);transition:opacity .24s var(--fv-ease),transform .28s var(--fv-ease)}
.fv-d-meta{position:absolute;left:5px;right:5px;bottom:26px;z-index:3;display:flex;flex-wrap:wrap;gap:3px;opacity:0;transform:translateY(6px);
 transition:opacity .26s var(--fv-ease) .02s,transform .3s var(--fv-ease) .02s}
.fv-d-rank,.fv-d-tg{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;line-height:15px;background:rgba(24,22,19,.74);color:#fff}
.fv-d-tg{background:rgba(255,255,255,.9);color:#3a3733;border:1px solid rgba(0,0,0,.08)}
.fv-d-cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(18,15,12,.46),rgba(18,15,12,0));
 opacity:0;pointer-events:none;z-index:1;transition:opacity .26s var(--fv-ease)}
.fv-d-subseg{position:absolute;left:50%;bottom:28px;z-index:5;display:flex;gap:2px;padding:2px;border-radius:9px;background:rgba(26,23,19,.62);
 opacity:0;transform:translate(-50%,6px) scale(.96);pointer-events:none;transition:opacity .22s var(--fv-ease),transform .3s var(--fv-ease)}
.fv-d-subseg button{width:26px;height:22px;padding:0;border:0;border-radius:7px;background:transparent;color:rgba(255,255,255,.82);font-size:11px;line-height:22px;font-family:inherit;font-weight:600}
.fv-d-subseg button.on{background:#c8a45c;color:#fff}
/* 演示：右侧面板把"悬停态"强制打开 */
.hovered figcaption,.hovered .fv-d-tag,.hovered .fv-d-meta{opacity:1;transform:none}
.hovered::after{opacity:1}
.hovered .fv-d-subseg{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.hovered{transform:translateY(-3px);border-color:rgba(156,139,116,.5);box-shadow:0 16px 30px -16px rgba(34,28,20,.42),0 2px 6px rgba(34,28,20,.07)}
.note{font-size:11.5px;color:#8a8172;margin:10px 2px 0;line-height:1.7}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;background:rgba(200,164,92,.16);color:#8b6b28;font-size:10.5px;margin-left:6px}
