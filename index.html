<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREND BANK · 视觉专区</title>
<link rel="stylesheet" href="css/style.css?v=20260910FIX">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="front">
  <!-- 提示条 -->
  <div id="toast" class="toast"></div>

  <!-- 加载遮罩：判定登录态期间盖住，避免闪现登录页 -->
  <div id="boot-splash" class="boot-splash">
    <div class="boot-inner"><span class="boot-text">TREND BANK</span></div>
  </div>

  <!-- ================= 登录页 ================= -->
  <section id="login-view" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="brand">
        <div class="trademark-avatar" aria-label="TREND BANK 商标">
          <svg viewBox="0 0 120 120" width="92" height="92" role="img" aria-label="TREND BANK">
            <circle cx="60" cy="60" r="58" fill="#ffffff"/>
            <circle cx="60" cy="60" r="57.5" fill="none" stroke="#e2ddd4" stroke-width="1"/>
            <text x="60" y="62" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="3" fill="#2c2c2c">TB</text>
            <text x="60" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="4" fill="#9c8b74">TREND&nbsp;BANK</text>
          </svg>
        </div>
        <div class="logo-mark" aria-label="TREND BANK"><span class="logo-dot"></span><span class="logo-word">TB</span></div>
        <h1 id="site-title"></h1>
        <p class="subtitle"></p>
      </div>
      <form id="login-form" class="auth-form">
        <h2 class="form-title" id="auth-title">访客登录</h2>
        <label>邮箱</label>
        <input type="email" id="auth-email" placeholder="请输入邮箱" autocomplete="email" required>
        <label>密码</label>
        <input type="password" id="auth-pass" placeholder="请输入密码" autocomplete="current-password" required>
        <button type="submit" class="btn-primary" id="auth-submit">进入图鉴</button>
        <div class="auth-links">
          <a href="#" id="auth-toggle-link" class="hidden">没有账号？注册一个</a>
          <span class="auth-sep">·</span>
          <a href="admin.html">管理员入口 →</a>
        </div>
      </form>
    </div>
  </section>

  <!-- ================= 画廊 ================= -->
  <section id="gallery-view" class="gallery-view hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-sm"><span class="logo-mark logo-sm" aria-label="TREND BANK"><span class="logo-dot"></span><span class="logo-word">TB</span></span> <span id="top-title"></span></div>
        <nav class="top-tabs">
          <a href="index.html" class="tab-link active">视觉专区</a>
          <a href="trends.html" class="tab-link">趋势专区</a>
          <a href="trends.html#recruit" class="tab-link">招品回品</a>
          <button type="button" id="notice-tab" class="tab-link notice-tab">公告<span id="notice-badge" class="notice-badge hidden">0</span></button>
        </nav>
        <div class="topbar-actions">
          <button id="login-btn" class="btn-ghost hidden">登录</button>
          <button id="logout-btn" class="btn-ghost hidden">退出</button>
        </div>
      </div>
    </header>

    <div class="gallery-layout">
      <!-- ===== 左侧：类目菜单栏 ===== -->
      <aside id="sidebar" class="sidebar">
        <div class="side-head">服装类目</div>
        <nav id="cat-menu" class="cat-menu"></nav>
      </aside>

      <!-- ===== 右侧：渠道/风格/元素 标签筛选（吸顶）+ 图片网格 ===== -->
      <main class="grid-wrap">
        <div id="tag-filter" class="tag-filter">
          <div class="tf-trigger">
            <span class="tf-t">筛选</span>
            <span class="tf-s" id="tf-summary">类目·渠道·风格·元素</span>
            <span class="tf-arrow">▾</span>
          </div>
          <div class="tf-body">
            <div class="tf-groups" id="tf-groups"></div>
          </div>
        </div>
        <p id="empty-tip" class="empty-tip hidden">该分类暂无可浏览的图片。</p>
        <div id="grid" class="grid"></div>
      </main>
    </div>
  </section>

  <!-- ================= 公告弹窗：未读 + 历史记录 ================= -->
  <div id="notice-modal" class="modal hidden">
    <div class="notice-dialog">
      <div class="notice-dialog-head">
        <div class="notice-tabs">
          <button type="button" class="notice-tab-btn active" data-ntab="unread">未读公告</button>
          <button type="button" class="notice-tab-btn" data-ntab="history">公告记录</button>
        </div>
        <div class="notice-head-actions">
          <span id="notice-unread-count" class="hint-inline"></span>
          <button type="button" class="notice-close" id="notice-close">×</button>
        </div>
      </div>
      <div id="notice-modal-body" class="notice-modal-body"></div>
    </div>
  </div>

  <!-- ============ 公告放大阅读层（点击查看全文） ============ -->
  <div id="notice-reader" class="modal hidden">
    <div class="notice-reader-dialog">
      <button type="button" class="notice-close" id="notice-reader-close">×</button>
      <h3 id="notice-reader-title" class="notice-reader-title"></h3>
      <div id="notice-reader-meta" class="notice-reader-meta"></div>
      <div id="notice-reader-body" class="notice-reader-body"></div>
    </div>
  </div>

  <!-- ================= 灯箱 ================= -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lb-close" id="lb-close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev">‹</button>
    <img id="lb-img" src="" alt="" draggable="false" ondragstart="return false;">
    <button class="lb-nav lb-next" id="lb-next">›</button>
    <div id="lb-caption" class="lb-caption"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260910FIX"></script>
  <script src="js/supabase.js?v=20260910FIX"></script>
  <script src="js/frontend.js?v=20260910FIX"></script>
</body>
</html>
