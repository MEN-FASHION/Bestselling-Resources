<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREND BANK · 趋势专区</title>
<link rel="stylesheet" href="css/style.css?v=20260911BK">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="front">
  <div id="toast" class="toast"></div>

  <!-- 加载遮罩：判定登录态期间盖住 -->
  <div id="boot-splash" class="boot-splash">
    <div class="boot-inner"><span class="boot-text">TREND BANK</span></div>
  </div>

  <!-- ================= 登录页（趋势专区始终需登录） ================= -->
  <section id="login-view" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="brand">
        <div class="trademark-avatar" aria-label="TREND BANK 商标">
          <svg viewBox="0 0 120 120" width="92" height="92" role="img" aria-label="TREND BANK">
            <circle cx="60" cy="60" r="58" fill="#ffffff"/>
            <circle cx="60" cy="60" r="57.5" fill="none" stroke="#e2ddd4" stroke-width="1"/>
            <text x="60" y="62" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="3" fill="#2c2c2c">TB</text>
            <text x="60" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="4" fill="#9c8b74">TREND&nbsp;BANK</text>
          </svg>
        </div>
        <div class="logo-mark" aria-label="TREND BANK"><span class="logo-dot"></span><span class="logo-word">TB</span></div>
        <h1 id="site-title"></h1>
        <p class="subtitle">趋势专区 · 登录后查看</p>
      </div>
      <form id="login-form" class="auth-form">
        <h2 class="form-title">趋势专区登录</h2>
        <label>邮箱</label>
        <input type="email" id="auth-email" placeholder="请输入邮箱" autocomplete="email" required>
        <label>密码</label>
        <input type="password" id="auth-pass" placeholder="请输入密码" autocomplete="current-password" required>
        <button type="submit" class="btn-primary" id="auth-submit">进入趋势专区</button>
        <div class="auth-links">
          <a href="index.html">← 返回视觉专区</a>
          <span class="auth-sep">·</span>
          <a href="admin.html">管理员入口 →</a>
        </div>
      </form>
    </div>
  </section>

  <!-- ================= 趋势专区 ================= -->
  <header class="topbar" id="front-topbar">
    <div class="topbar-inner">
      <div class="brand-sm"><span class="logo-mark logo-sm" aria-label="TREND BANK"><span class="logo-dot"></span><span class="logo-word">TB</span></span> <span id="front-brand">TREND BANK</span></div>
      <nav class="top-tabs">
        <a href="index.html" class="tab-link">视觉专区</a>
        <a href="trends.html" class="tab-link" data-viewtab="trend">趋势专区</a>
        <a href="trends.html#recruit" class="tab-link" data-viewtab="recruit">招品回品</a>
        <button type="button" id="notice-tab" class="tab-link notice-tab">公告<span id="notice-badge" class="notice-badge hidden">0</span></button>
      </nav>
      <div class="topbar-actions">
        <button id="logout-btn" class="btn-ghost hidden">退出</button>
      </div>
    </div>
  </header>

  <section id="trend-view" class="gallery-view hidden">
    <div class="gallery-layout">
      <!-- 左侧：类目菜单（复用视觉专区类目，仅显示有趋势文件的类目） -->
      <aside id="sidebar" class="sidebar">
        <div class="side-head">趋势类目</div>
        <nav id="cat-menu" class="cat-menu"></nav>
      </aside>

      <!-- 右侧：标签筛选（吸顶）+ 趋势文件卡片网格 -->
      <main class="grid-wrap">
        <div class="trend-filter" id="trend-filter">
          <button class="trend-filter-btn active" data-tag="全部">全部</button>
          <button class="trend-filter-btn" data-tag="类目">类目</button>
          <button class="trend-filter-btn" data-tag="月度">月度</button>
          <button class="trend-filter-btn" data-tag="周度">周度</button>
        </div>
        <p id="trend-empty" class="empty-tip hidden">该分类暂无趋势文件。</p>
        <div class="trend-grid" id="trend-list"></div>
      </main>
    </div>
  </section>

  <!-- ================= 招品回品 ================= -->
  <section id="recruit-view" class="gallery-view hidden">
    <div class="recruit-wrap">
      <p id="recruit-tip" class="hint">在货品SPU框内填写递交的货品SPU（多个用英文逗号分隔）并保存；鼠标悬浮任务ID或图片可见该任务已提交的所有货品SPU。</p>
      <div class="recruit-grid" id="recruit-list"></div>
    </div>
  </section>

  <!-- ================= PDF 预览弹层（受控鉴权，防下载） ================= -->
  <!-- ================= 公告弹窗：未读 + 历史记录 ================= -->
  <div id="notice-modal" class="modal hidden">
    <div class="notice-dialog">
      <div class="notice-dialog-head">
        <div class="notice-tabs">
          <button type="button" class="notice-tab-btn active" data-ntab="unread">未读公告</button>
          <button type="button" class="notice-tab-btn" data-ntab="history">公告记录</button>
        </div>
        <div class="notice-head-actions">
          <span id="notice-unread-count" class="hint-inline"></span>
          <button type="button" class="notice-close" id="notice-close">×</button>
        </div>
      </div>
      <div id="notice-modal-body" class="notice-modal-body"></div>
    </div>
  </div>

  <!-- ============ 公告放大阅读层（点击查看全文） ============ -->
  <div id="notice-reader" class="modal hidden">
    <div class="notice-reader-dialog">
      <button type="button" class="notice-close" id="notice-reader-close">×</button>
      <h3 id="notice-reader-title" class="notice-reader-title"></h3>
      <div id="notice-reader-meta" class="notice-reader-meta"></div>
      <div id="notice-reader-body" class="notice-reader-body"></div>
    </div>
  </div>

  <div id="pdf-modal" class="modal-mask hidden">
    <div class="modal pdf-modal-box">
      <div class="pdf-modal-head">
        <span id="pdf-title">预览</span>
        <div class="pdf-modal-tools">
          <button id="pdf-prev" class="btn-ghost" type="button">‹ 上一页</button>
          <span id="pdf-page" class="pdf-pageno">1 / 1</span>
          <button id="pdf-next" class="btn-ghost" type="button">下一页 ›</button>
          <span class="pdf-sep">|</span>
          <button id="pdf-zoom-out" class="btn-ghost" type="button">−</button>
          <span id="pdf-zoom" class="pdf-pageno">100%</span>
          <button id="pdf-zoom-in" class="btn-ghost" type="button">＋</button>
          <button id="pdf-close" class="btn-ghost">关闭</button>
        </div>
      </div>
      <div class="pdf-stage" id="pdf-stage">
        <canvas id="pdf-canvas" class="pdf-canvas" width="800" height="1100" style="display:none;"></canvas>
        <p id="pdf-loading" class="pdf-loading">正在加载预览…</p>
      </div>
      <div class="pdf-tip">· 仅凭角色的在线预览许可查看本文件，禁止下载、打印与传播 ·</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260911BK"></script>
  <script src="js/supabase.js?v=20260911BK"></script>
  <script src="js/trends.js?v=20260911BK"></script>
</body>
</html>
