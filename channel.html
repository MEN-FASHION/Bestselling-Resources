    <div class="gallery-layout">

      <aside class="sidebar">
        <div class="side-head">类目</div>

      </aside>

      <!-- ===== 右侧：渠道对比池（列 = 渠道，不是周次） ===== -->

        <div id="ch-filter" class="ch-filter">
          <div class="ch-fg">
            <span class="ch-fg-name">渠道</span>
            <div class="ch-chips" id="ch-channels"></div>
            <div class="ch-tools">
              <button type="button" class="ch-mini" id="ch-ch-all">有数据全选</button>
              <button type="button" class="ch-mini" id="ch-ch-none">清空</button>
            </div>
          </div>
          <div class="ch-fg">
            <span class="ch-fg-name">周次</span>
            <div class="ch-chips" id="ch-weeks"></div>
            <div class="ch-tools">
              <span class="hint-inline" id="ch-hint">按渠道并排对比同一类目、同一周次的图片</span>
            </div>
          </div>
